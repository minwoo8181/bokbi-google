# push·PR마다 자동 검사: 타입 검사 + 단위 테스트 (check), 화면 흐름 Playwright (e2e)
# 비밀 값 없이 local 모드(브라우저 저장소)로 돈다. 실패하면 GitHub가 push한 사람에게 메일
name: CI

on:
  push:
    branches: [main]
    # 문서만 바뀐 push는 검사하지 않는다 (무료 분 절약). 문구(siteContent.ts)는 코드라 검사함
    paths-ignore: ['**/*.md', 'docs/**', '.claude/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', '.claude/**']

# 같은 브랜치에 새 push가 오면 이전 실행 취소 (무료 분 절약)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playwright 공식 이미지: Chromium과 시스템 라이브러리가 들어 있어 설치 단계가 없다.
    # 예전엔 매번 브라우저와 apt 라이브러리를 깔아 1회 10~12분 걸렸다 (테스트 자체는 40초).
    # 태그는 package-lock의 @playwright/test 버전과 같아야 한다 (src/__tests__/ciPlaywrightImage.test.ts가 확인)
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run e2e
      - name: 실패 스크린샷·trace 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7
